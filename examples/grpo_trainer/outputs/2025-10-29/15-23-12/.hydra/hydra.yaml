hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - algorithm.adv_estimator=grpo
    - data.train_files=/share/xiayinan/GRPO-LEAD/data/train/train.parquet
    - data.val_files=/share/xiayinan/datasets/gather_data.parquet
    - data.train_batch_size=128
    - data.val_batch_size=null
    - data.max_prompt_length=1024
    - data.max_response_length=12800
    - data.filter_overlong_prompts=True
    - data.dataloader_num_workers=0
    - data.truncation=error
    - actor_rollout_ref.model.path=/share/xiayinan/models/Qwen3-14B-ft-limo
    - actor_rollout_ref.actor.optim.lr=1e-6
    - actor_rollout_ref.model.use_remove_padding=True
    - actor_rollout_ref.actor.ppo_mini_batch_size=8
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=2
    - actor_rollout_ref.actor.use_kl_loss=True
    - actor_rollout_ref.actor.kl_loss_coef=0.001
    - actor_rollout_ref.actor.kl_loss_type=low_var_kl
    - actor_rollout_ref.actor.entropy_coeff=0
    - actor_rollout_ref.actor.checkpoint.save_contents=[hf_model]
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - actor_rollout_ref.actor.fsdp_config.param_offload=False
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=False
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=8
    - actor_rollout_ref.rollout.enable_chunked_prefill=True
    - actor_rollout_ref.rollout.max_num_batched_tokens=13824
    - actor_rollout_ref.rollout.tensor_model_parallel_size=2
    - actor_rollout_ref.rollout.name=vllm
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.75
    - actor_rollout_ref.rollout.n=5
    - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=8
    - actor_rollout_ref.ref.fsdp_config.param_offload=True
    - trainer.critic_warmup=0
    - trainer.logger=["console","wandb"]
    - trainer.project_name=GRPO
    - trainer.experiment_name=qwen_14b_limo_grpo_12800_128_accum_1_0_dynamic_dyn_avg_th_0.2_dyn_a_1-a_bar_rerun
    - trainer.n_gpus_per_node=8
    - trainer.nnodes=4
    - trainer.save_freq=5
    - trainer.test_freq=5
    - trainer.total_epochs=3
    - trainer.validation_data_dir=/share/xiayinan/verl/gen_results/qwen_14b_limo_grpo_12800_128_accum_1_0_dynamic_dyn_avg_th_0.2_dyn_a_1-a_bar_rerun
    - +trainer.filter_easy_acc=1
    - +trainer.filter_hard_acc=0
    - reward_model.reward_manager=dynamic
  job:
    name: main_ppo
    chdir: null
    override_dirname: +trainer.filter_easy_acc=1,+trainer.filter_hard_acc=0,actor_rollout_ref.actor.checkpoint.save_contents=[hf_model],actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.fsdp_config.optimizer_offload=False,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.kl_loss_coef=0.001,actor_rollout_ref.actor.kl_loss_type=low_var_kl,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=2,actor_rollout_ref.actor.ppo_mini_batch_size=8,actor_rollout_ref.actor.use_kl_loss=True,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/share/xiayinan/models/Qwen3-14B-ft-limo,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.ref.fsdp_config.param_offload=True,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=8,actor_rollout_ref.rollout.enable_chunked_prefill=True,actor_rollout_ref.rollout.gpu_memory_utilization=0.75,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=8,actor_rollout_ref.rollout.max_num_batched_tokens=13824,actor_rollout_ref.rollout.n=5,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.tensor_model_parallel_size=2,algorithm.adv_estimator=grpo,data.dataloader_num_workers=0,data.filter_overlong_prompts=True,data.max_prompt_length=1024,data.max_response_length=12800,data.train_batch_size=128,data.train_files=/share/xiayinan/GRPO-LEAD/data/train/train.parquet,data.truncation=error,data.val_batch_size=null,data.val_files=/share/xiayinan/datasets/gather_data.parquet,reward_model.reward_manager=dynamic,trainer.critic_warmup=0,trainer.experiment_name=qwen_14b_limo_grpo_12800_128_accum_1_0_dynamic_dyn_avg_th_0.2_dyn_a_1-a_bar_rerun,trainer.logger=["console","wandb"],trainer.n_gpus_per_node=8,trainer.nnodes=4,trainer.project_name=GRPO,trainer.save_freq=5,trainer.test_freq=5,trainer.total_epochs=3,trainer.validation_data_dir=/share/xiayinan/verl/gen_results/qwen_14b_limo_grpo_12800_128_accum_1_0_dynamic_dyn_avg_th_0.2_dyn_a_1-a_bar_rerun
    id: ???
    num: ???
    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /share/xiayinan/verl/examples/grpo_trainer
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /share/xiayinan/verl/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /share/xiayinan/verl/examples/grpo_trainer/outputs/2025-10-29/15-23-12
    choices:
      reward_model: dp_reward_model
      critic: dp_critic
      critic/../engine@critic.model.fsdp_config: fsdp
      critic/../optim@critic.optim: fsdp
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      data: legacy_data
      actor@actor_rollout_ref.actor: dp_actor
      actor/../engine@actor_rollout_ref.actor.fsdp_config: fsdp
      actor/../optim@actor_rollout_ref.actor.optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
